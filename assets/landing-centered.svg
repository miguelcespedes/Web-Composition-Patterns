<svg id="layout-centered-hero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-uid="0f7d6f1e-5c5b-4ef7-8f7b-3a8e2d1d9c01" role="img" aria-labelledby="title desc">
  <title id="title">Centered Hero Composition</title><desc id="desc">A landing page composition with a centered hero and stacked supporting sections.</desc>
  <defs><pattern id="canvas-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e5e5e5" stroke-width="1"/></pattern><pattern id="canvas-grid-focus" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cfcfcf" stroke-width="1"/></pattern></defs>
  <rect id="canvas" width="1000" height="700" fill="url(#canvas-grid)" data-role="canvas" data-region-id="canvas"/>
  <rect id="canvas-boundary" x="5" y="5" width="990" height="690" fill="none" stroke="#D6D6D6" stroke-width="1" stroke-dasharray="2 8"/>
  <rect id="shell-navigation" x="35" y="28" width="930" height="52" rx="2" fill="#e7ecef" stroke="#aeb9c0" stroke-width="2" data-role="shell" data-region-id="shell-navigation"/>
  <text id="label-shell-navigation" x="500" y="61" fill="#171615" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" data-role="shell" data-region-id="shell-navigation">SHELL / NAVIGATION</text>
  <rect id="main-proposition" x="180" y="130" width="640" height="220" rx="4" fill="#9dd9ff" stroke="#5fa7d5" stroke-width="2" data-role="hero" data-region-id="main-proposition"/>
  <text id="label-main-proposition" x="500" y="205" fill="#241b2f" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="main-proposition">MAIN PROPOSITION</text>
  <text id="label-main-proposition-detail" x="500" y="238" fill="#52604f" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" data-role="hero" data-region-id="main-proposition">Short promise + supporting context</text>
  <rect id="action-cta" x="390" y="270" width="220" height="42" rx="21" fill="#171615" data-role="action" data-region-id="action-cta"/>
  <text id="label-action-cta" x="500" y="297" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" data-role="action" data-region-id="action-cta">ACTION / CTA</text>
  <rect id="support-proof" x="180" y="390" width="640" height="100" rx="4" fill="#d9ead3" stroke="#82a878" stroke-width="2" data-role="support" data-region-id="support-proof"/>
  <text id="label-support-proof" x="500" y="448" fill="#171615" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" data-role="support" data-region-id="support-proof">SUPPORT / PROOF</text>
  <rect id="shell-footer" x="35" y="550" width="930" height="52" rx="2" fill="#e7ecef" stroke="#aeb9c0" stroke-width="2" data-role="shell" data-region-id="shell-footer"/>
  <text id="label-shell-footer" x="500" y="583" fill="#171615" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" data-role="shell" data-region-id="shell-footer">SHELL / FOOTER</text>
</svg>
