<svg id="layout-hero-dark-mode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-uid="12345678-9bcd-43ef-8012-3456789abcde" role="img" aria-labelledby="title desc"><title id="title">Dark Mode Hero</title><desc id="desc">A hero composition using a dark visual field for emphasis and contrast.</desc><defs><pattern id="canvas-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e5e5e5"/></pattern><pattern id="canvas-grid-focus" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cfcfcf"/></pattern></defs><rect id="canvas" width="1000" height="700" fill="url(#canvas-grid)" data-role="canvas" data-region-id="canvas"/><rect id="hero-dark-mode" x="90" y="110" width="820" height="480" rx="6" fill="#171615" stroke="#0b0a2b" stroke-width="2" data-role="hero" data-region-id="hero-dark-mode"/><text x="500" y="285" fill="#fff" font-family="Arial" font-size="32" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-dark-mode">HERO / DARK MODE</text><text x="500" y="330" fill="#9dd9ff" font-family="Arial" font-size="16" text-anchor="middle" data-role="hero" data-region-id="hero-dark-mode">Contrast-led introduction</text><rect x="400" y="380" width="200" height="42" rx="21" fill="#9dd9ff" data-role="hero" data-region-id="hero-dark-mode"/></svg>
