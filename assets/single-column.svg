  <rect x="155" y="35" width="490" height="550" rx="4" fill="#e8f4f8" stroke="#6c8ebf" stroke-width="2"/>
  <text x="400" y="76" fill="#172b4d" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">SINGLE COLUMN</text>
