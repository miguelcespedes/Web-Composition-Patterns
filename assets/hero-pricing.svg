<svg id="layout-hero-pricing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-uid="90123456-7efa-4189-abcd-ef0123456789" role="img" aria-labelledby="title desc"><title id="title">Pricing Hero</title><desc id="desc">A hero composition making the price and plan choice immediately visible.</desc><defs><pattern id="canvas-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e5e5e5"/></pattern><pattern id="canvas-grid-focus" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cfcfcf"/></pattern></defs><rect id="canvas" width="1000" height="700" fill="url(#canvas-grid)" data-role="canvas" data-region-id="canvas"/><rect id="hero-pricing" x="105" y="105" width="790" height="490" rx="6" fill="#9dd9ff" stroke="#5fa7d5" stroke-width="2" data-role="hero" data-region-id="hero-pricing"/><text x="500" y="220" fill="#241b2f" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-pricing">HERO / PRICING</text><rect x="345" y="265" width="310" height="205" rx="6" fill="#fff" data-role="hero" data-region-id="hero-pricing"/><text x="500" y="350" fill="#241b2f" font-family="Arial" font-size="40" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-pricing">$ / PLAN</text><rect x="400" y="495" width="200" height="42" rx="21" fill="#171615" data-role="hero" data-region-id="hero-pricing"/></svg>
