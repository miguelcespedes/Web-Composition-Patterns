<svg id="layout-hero-typographic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-uid="23456789-acde-4f01-9123-456789abcdef" role="img" aria-labelledby="title desc"><title id="title">Typographic Hero</title><desc id="desc">A hero composition where oversized type is the primary visual element.</desc><defs><pattern id="canvas-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e5e5e5"/></pattern><pattern id="canvas-grid-focus" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cfcfcf"/></pattern></defs><rect id="canvas" width="1000" height="700" fill="url(#canvas-grid)" data-role="canvas" data-region-id="canvas"/><rect id="hero-typographic" x="75" y="115" width="850" height="470" rx="6" fill="#9dd9ff" stroke="#5fa7d5" stroke-width="2" data-role="hero" data-region-id="hero-typographic"/><text x="500" y="310" fill="#241b2f" font-family="Arial" font-size="84" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-typographic">TYPE</text><text x="500" y="365" fill="#52604f" font-family="Arial" font-size="18" text-anchor="middle" data-role="hero" data-region-id="hero-typographic">HERO / TYPOGRAPHIC</text><rect x="405" y="415" width="190" height="42" rx="21" fill="#171615" data-role="hero" data-region-id="hero-typographic"/></svg>
