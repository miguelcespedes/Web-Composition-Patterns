<svg id="layout-hero-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-uid="b2c3d4e5-f678-4901-2abc-3456789abcde" role="img" aria-labelledby="title desc">
  <title id="title">Editorial Hero Composition</title><desc id="desc">A hero-only composition with a strong editorial statement and offset visual field.</desc>
  <defs><pattern id="canvas-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e5e5e5" stroke-width="1"/></pattern><pattern id="canvas-grid-focus" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cfcfcf" stroke-width="1"/></pattern></defs>
  <rect id="canvas" width="1000" height="700" fill="url(#canvas-grid)" data-role="canvas" data-region-id="canvas"/>
  <rect id="canvas-boundary" x="5" y="5" width="990" height="690" fill="none" stroke="#D6D6D6" stroke-width="1" stroke-dasharray="2 8"/>
  <rect id="hero-editorial" x="100" y="110" width="800" height="430" rx="6" fill="#9dd9ff" stroke="#5fa7d5" stroke-width="2" data-role="hero" data-region-id="hero-editorial"/>
  <rect id="hero-editorial-visual" x="585" y="155" width="240" height="340" rx="4" fill="#e1d5e7" data-role="hero" data-region-id="hero-editorial"/>
  <text id="label-hero-editorial" x="330" y="260" fill="#241b2f" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-editorial">HERO / EDITORIAL</text>
  <text id="label-hero-editorial-detail" x="330" y="300" fill="#52604f" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" data-role="hero" data-region-id="hero-editorial">Statement-led introduction</text>
  <rect id="hero-editorial-action" x="235" y="350" width="190" height="42" rx="21" fill="#171615" data-role="hero" data-region-id="hero-editorial"/>
  <text id="hero-editorial-action-label" x="330" y="377" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" data-role="hero" data-region-id="hero-editorial">EXPLORE</text>
</svg>
